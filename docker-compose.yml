version: '3.8'

services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    container_name: fraud_inference_service
    ports:
      - "8000:8000"
    volumes:
      # Общие папки: связывакм локальные папки с папками внутри контейнера
      - ./models_registry:/app/models_registry
      - ./data:/app/data
    env_file:
      - .env
    restart: always

  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    container_name: fraud_train_service
    volumes:
      - ./models_registry:/app/models_registry
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - INFERENCE_INTERNAL_URL=http://inference:8000
    # Отключаем автоматический запуск при docker compose up
    profiles:
      - manual